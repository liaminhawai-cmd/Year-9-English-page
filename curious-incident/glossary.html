<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="My glossary: the Curious Incident chapter by chapter. Eight words a block, their parts, the sentence from the book, your own note, a word challenge and a gap fill.">
<title>Curious Incident · My glossary</title>
<link rel="stylesheet" href="folio.css?v=3">
<style>
html{font-size:clamp(15px, .5vw + 9px, 24px)}
.sheet{max-width:min(96vw,1900px)}
:root{--m-pre:#2c6fa8;--m-root:#9a5518;--m-suf:#3f7a4a}
.screen{display:none}.screen.active{display:block}
[hidden]{display:none!important}
.mast h1{font-size:1.4rem;margin:0}.mast{margin-bottom:6px;padding-bottom:4px}.mast .kicker{font-size:.7rem}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 8px}
.prog{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.blocks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.blk.core{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;border-color:var(--deep);background:var(--band)} .blk.core .sc{margin:0 0 0 auto}
@media (max-width:1000px){.blocks{grid-template-columns:repeat(2,1fr)}}
.blk{display:flex;flex-direction:column;gap:5px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper);cursor:pointer;font:inherit;color:inherit}
.blk:hover{border-color:var(--deep)}
.blk .n{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.blk .t{font-weight:800;font-size:1rem;color:var(--deep)} .blk .d{font-size:.8rem;color:var(--muted)}
.blk .sc{display:flex;gap:6px;margin-top:4px;font-size:.74rem;font-weight:700}
.blk .sc span{padding:2px 8px;border-radius:999px;background:var(--band);border:1px solid var(--line);color:var(--muted)}
.blk .sc span.ok{background:#eef5ee;border-color:#2f6a3e;color:#2f6a3e}
.steps{display:flex;gap:8px;margin:8px 0 10px;flex-wrap:wrap}
.steps button{font-size:.8rem}
.steps button[aria-pressed="true"]{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.legend{display:flex;gap:14px;font-size:.74rem;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:3px 10px;background:var(--band)}
.legend .mp,.fb .mp{color:var(--m-pre)} .legend .mr,.fb .mr{color:var(--m-root)} .legend .ms,.fb .ms{color:var(--m-suf)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:1100px){.cards{grid-template-columns:repeat(6,1fr)}}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
/* build: tap the parts in order */
.bline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:56px;padding:10px;border:2px dashed var(--line);border-radius:10px;background:var(--band);margin:6px 0 12px}
.bline.right{border-style:solid;border-color:#2f6a3e;background:#eef5ee} .bline.wrong{border-style:solid;border-color:#a83232;background:#f7ecec}
.bline .ph{font-size:.82rem;color:var(--muted);font-weight:700}
.bank{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tile{font-family:Georgia,serif;font-size:1.15rem;font-weight:700;padding:8px 13px;border:2px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px}
.tile small{font-family:'Segoe UI',Tahoma,sans-serif;font-size:.66rem;font-weight:600;color:var(--muted)}
.tile.p{color:var(--m-pre)} .tile.r{color:var(--m-root)} .tile.s{color:var(--m-suf)}
.tile:hover:not(:disabled){border-color:var(--deep)} .tile:disabled{opacity:.35;cursor:default}
.bline .tile{cursor:pointer}
.vcard{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--paper);display:flex;flex-direction:column;gap:2px}
.vcard .w{font-family:Georgia,serif;font-size:1.05rem;font-weight:700}
.vcard .w .mp{color:var(--m-pre)} .vcard .w .mr{color:var(--m-root)} .vcard .w .ms{color:var(--m-suf)}
.vcard .pos{font-size:.74rem;color:var(--muted);font-style:italic;margin-left:6px}
.vcard .meaning{font-size:.82rem;line-height:1.32}
.vcard .morph{font-size:.7rem;color:var(--muted);line-height:1.28;border-top:1px dashed var(--line);padding-top:3px}
.vcard .morph b{color:var(--ink)}
.vcard .q{font-size:.72rem;color:var(--deep);font-style:italic;line-height:1.28} .vcard .q small{color:var(--muted);font-style:normal}
.vcard textarea{width:100%;font:inherit;font-size:.72rem;line-height:1.25;min-height:2em;padding:4px 6px;border:1px dashed var(--line);border-radius:6px;background:var(--band);color:var(--ink);resize:vertical;margin-top:auto}
.vcard textarea::placeholder{color:var(--muted)}
.task{max-width:820px;margin:0 auto}
.qlab{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.qtext{font-size:1.1rem;line-height:1.55;margin-bottom:14px}
.qtext .gap{display:inline-block;min-width:120px;border-bottom:2px solid var(--ink);text-align:center;font-weight:800;color:var(--accent)}
.qtext small{color:var(--muted);font-size:.78rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font:inherit;font-size:.95rem;text-align:left;cursor:pointer;color:inherit}
.opt:hover:not(:disabled){border-color:var(--deep)} .opt:disabled{cursor:default}
.opt.right{background:#eef5ee;border-color:#2f6a3e;color:#2f6a3e;font-weight:700}
.opt.wrongpick{background:#f7ecec;border-color:#a83232;color:#a83232}
.fb{margin-top:12px;padding:11px 13px;border-radius:8px;font-size:.9rem;line-height:1.5;display:none}
.fb.show{display:block} .fb.good{background:#eef5ee;color:#234e2c} .fb.bad{background:#f7ecec;color:#7a2020}
.nextrow{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.sumbox{border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px auto;text-align:center;max-width:520px}
.sumbox .big{font-family:Georgia,serif;font-size:2rem;font-weight:700;color:var(--deep)}
.repgrid{width:100%;max-width:900px;border-collapse:collapse;margin:12px auto}
.repgrid th,.repgrid td{border:1px solid var(--line);padding:6px 10px;font-size:.86rem;text-align:left}
.repgrid th{background:var(--band);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.idrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.idrow input{padding:8px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--paper);min-width:220px}
.linkbtn{background:none;border:none;color:var(--deep);font:inherit;font-weight:700;cursor:pointer;padding:4px 8px}
.mynotes{max-width:900px;margin:0 auto}
.mynotes .row{display:grid;grid-template-columns:180px 1fr;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line);font-size:.86rem}
@media print{ nav.site,.tools,.topbar,.nextrow,.steps,.noprint{display:none!important} .screen{display:none} .screen.active{display:block} }
</style>
</head>
<body>
<div class="sheet">
<header class="mast">
  <div>
    <div class="kicker">Year 9 English · The Curious Incident of the Dog in the Night-Time</div>
    <h1>My glossary</h1>
  </div>
</header>

<div class="screen active" id="scr-home">
  <div class="blocks" id="blocks"></div>
  <p class="foot">Core vocab first, then the novel chapter by chapter. Read the words, write your own note, then the word challenge and the gap fill. First attempts go on the report. <button class="linkbtn" id="report">My report</button> · <button class="linkbtn" id="reset">Start over</button></p>
</div>

<div class="screen" id="scr-block">
  <div class="topbar"><button class="linkbtn" data-go="home">← all chapters</button><span class="legend"><span class="mp">prefix</span><span class="mr">root</span><span class="ms">suffix</span></span><span class="prog" id="bname"></span></div>
  <div class="steps" id="steps"></div>
  <div id="study"><div class="cards" id="cards"></div></div>
  <div class="task" id="task" hidden></div>
</div>

<div class="screen" id="scr-report">
  <div class="topbar"><button class="linkbtn" data-go="home">← all chapters</button><span class="prog">My report</span></div>
  <div id="report-body"></div>
</div>
</div>

<script src="glossary-data.js?v=3"></script>
<script>
"use strict";
const KEY = "ci_glossary";
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const blank = () => ({ first:{}, done:{}, notes:{}, name:"" });
let S = (()=>{ try{ const s=JSON.parse(localStorage.getItem(KEY)); return s && s.first ? s : blank(); }catch(e){ return blank(); } })();
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
let cur = null, step = "study";

function go(name){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); $("#scr-"+name).classList.add("active"); if(name==="home") renderHome(); if(name==="report") renderReport(); window.scrollTo(0,0); }
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("#reset").onclick = ()=>{ if(confirm("Clear your notes and scores?")){ S=blank(); save(); go("home"); } };
$("#report").onclick = ()=>go("report");

const score = (b, kind) => { const t=b.words.length; const r=b.words.filter((w,i)=>S.first[b.id+kind+i]===true).length; return { r, t }; };
const doneKey = (b, kind) => S.done[b.id+kind];
function renderHome(){
  $("#blocks").innerHTML = BLOCKS.map((b,i)=>{ const m=score(b,"m"), g=score(b,"g");
    return `<button class="blk${b.core?" core":""}" data-i="${i}"><span class="n">${b.core?"Core":"Block "+i}</span><span class="t">${esc(b.name)}</span><span class="d">${esc(b.sub)}</span>
      <span class="sc"><span class="${doneKey(b,"b")?"ok":""}">${doneKey(b,"b")?`build ${score(b,"b").r}/${score(b,"b").t}`:"build"}</span><span class="${doneKey(b,"m")?"ok":""}">${doneKey(b,"m")?`words ${m.r}/${m.t}`:"words"}</span><span class="${doneKey(b,"g")?"ok":""}">${doneKey(b,"g")?`gaps ${g.r}/${g.t}`:"gaps"}</span></span></button>`; }).join("");
  $("#blocks").querySelectorAll(".blk").forEach(b=>b.onclick=()=>{ cur=BLOCKS[+b.dataset.i]; step="study"; openBlock(); });
}
const colourWord = v => v.parts.map(([t,k])=>`<span class="m${k==="p"?"p":k==="s"?"s":"r"}">${esc(t)}</span>`).join("");
function openBlock(){
  go("block"); $("#bname").textContent = cur.name;
  $("#steps").innerHTML = [["study","1 · Study"],["build","2 · Build"],["match","3 · Word challenge"],["gap","4 · Gap fill"]].map(([k,l])=>`<button data-s="${k}" aria-pressed="${k===step}">${l}</button>`).join("");
  $("#steps").querySelectorAll("button").forEach(b=>b.onclick=()=>{ step=b.dataset.s; openBlock(); });
  $("#study").hidden = step!=="study"; $("#task").hidden = step==="study";
  if(step==="study") renderStudy(); else if(step==="build") startBuild(); else if(step==="match") startMatch(); else startGap();
}
function renderStudy(){
  $("#cards").innerHTML = cur.words.map((v,i)=>`<div class="vcard"><span class="w">${colourWord(v)}</span><span class="pos">${v.pos}</span><div class="meaning">${esc(v.meaning)}</div><div class="morph">${v.morph}</div><div class="q">“${esc(v.q)}” <small>${v.ch?"ch. "+v.ch:esc(v.src||"")}</small></div><textarea data-i="${i}" placeholder="My note: in my words, or in my language">${esc(S.notes[cur.id+i]||"")}</textarea></div>`).join("");
  $("#cards").querySelectorAll("textarea").forEach(t=>t.oninput=()=>{ S.notes[cur.id+t.dataset.i]=t.value; save(); });
}
/* quiz: wrong answers come back; the first attempt is what is recorded */
function runQuiz({ items, kind, label, render, onDone }){
  let queue = shuffle(items.map((it,i)=>({it,i})));
  const next = ()=>{
    if(!queue.length){ onDone(); return; }
    const {it,i} = queue.shift();
    const left = new Set([i, ...queue.map(q=>q.i)]).size;
    $("#task").innerHTML = `<div class="qlab">${label} · ${items.length - left + 1} of ${items.length}</div>` + render(it) +
      `<div class="opts">${shuffle(it.opts).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div><div class="fb" id="fb"></div><div class="nextrow"><button class="primary" id="nxt" hidden>Next →</button></div>`;
    $("#task").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok = b.dataset.v===it.a;
      if(!(cur.id+kind+i in S.first)) { S.first[cur.id+kind+i]=ok; save(); }
      $("#task").querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(x.dataset.v===it.a) x.classList.add("right"); });
      if(!ok){ b.classList.add("wrongpick"); queue.push({it,i}); }
      const fb=$("#fb"); fb.className="fb show "+(ok?"good":"bad"); fb.innerHTML=(ok?"✓ ":"✗ ")+it.explain+(ok?"":" It will come back.");
      $("#nxt").hidden=false; $("#nxt").focus();
    });
    $("#nxt").onclick = next;
  };
  next();
}
const others = (v, n) => shuffle(cur.words.filter(w=>w!==v).map(w=>w.w)).slice(0,n);
function matchItems(){ return cur.words.map(v=>({ a:v.w, q:v.meaning, opts:[v.w, v.alike, ...others(v,2)], explain:`<b>${esc(v.w)}</b>: ${v.morph}` })); }
function gapItems(){ return cur.words.map(v=>{ const text=v.gap||v.q; const stem=v.w.replace(/[ey]$/,"").replace(/[-]/g,"\\-");
  const re=new RegExp("\\b"+stem+"[a-z]{0,3}\\b","i"); const m=text.match(re); const form=m?m[0]:v.w;
  return { a:v.w, before:text.slice(0, m?m.index:0), after:text.slice(m?m.index+form.length:0), ch:v.ch, src:v.src, opts:[v.w, ...others(v,3)], explain:`<b>${esc(v.w)}</b>: ${esc(v.meaning)}` }; }); }
/* build: the parts of the word, shuffled, with one decoy part from another word */
function startBuild(){
  let queue = shuffle(cur.words.map((v,i)=>({v,i})));
  const next = ()=>{
    if(!queue.length){ S.done[cur.id+"b"]=true; save(); summary("b","Build","Word challenge →",()=>{ step="match"; openBlock(); }); return; }
    const {v,i} = queue.shift(); const left = new Set([i, ...queue.map(q=>q.i)]).size;
    const own = v.parts.map((p,k)=>({ id:"p"+k, t:p[0], k:p[1], g:p[2] }));
    const pool = cur.words.filter(w=>w!==v).flatMap(w=>w.parts).filter(p=>!v.parts.some(q=>q[0]===p[0]));
    const d = pool.length ? shuffle(pool)[0] : null;
    const bank = shuffle(own.concat(d ? [{ id:"d", t:d[0], k:d[1], g:d[2] }] : []));
    let line = [];
    const draw = ()=>{
      $("#task").innerHTML = `<div class="qlab">Build the word · ${cur.words.length - left + 1} of ${cur.words.length}</div>
        <div class="qtext">${esc(v.meaning)} <small>${esc(v.pos)}</small></div>
        <div class="bline" id="bline">${line.length? line.map(id=>{ const b=bank.find(x=>x.id===id); return `<button class="tile ${b.k}" data-un="${id}">${esc(b.t)}</button>`; }).join("") : '<span class="ph">tap the parts in order</span>'}</div>
        <div class="bank">${bank.map(b=>`<button class="tile ${b.k}" data-pl="${b.id}" ${line.includes(b.id)?"disabled":""}>${esc(b.t)}<small>${esc(b.g)}</small></button>`).join("")}</div>
        <div class="fb" id="fb"></div><div class="nextrow"><button id="clr">Clear</button><button class="primary" id="chk" ${line.length?"":"disabled"}>Check</button><button class="primary" id="nxt" hidden>Next →</button></div>`;
      $("#task").querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{ line.push(b.dataset.pl); draw(); });
      $("#task").querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{ line=line.filter(x=>x!==b.dataset.un); draw(); });
      $("#clr").onclick=()=>{ line=[]; draw(); };
      $("#chk").onclick=()=>{
        const got=line.map(id=>bank.find(x=>x.id===id).t).join(""); const ok = got===v.w.replace(/[- ]/g,"");
        if(!(cur.id+"b"+i in S.first)) { S.first[cur.id+"b"+i]=ok; save(); }
        $("#bline").classList.add(ok?"right":"wrong");
        $("#task").querySelectorAll(".tile").forEach(t=>t.disabled=true); $("#chk").hidden=true; $("#clr").hidden=true;
        const fb=$("#fb"); fb.className="fb show "+(ok?"good":"bad");
        fb.innerHTML=(ok?"✓ ":"✗ ")+`<b>${esc(v.w)}</b>: `+v.parts.map(p=>`<span class="${p[1]==="p"?"mp":p[1]==="s"?"ms":"mr"}"><b>${esc(p[0])}</b></span> (${esc(p[2])})`).join(" + ")+(ok?"":". It will come back.");
        if(!ok) queue.push({v,i});
        $("#nxt").hidden=false; $("#nxt").onclick=next; $("#nxt").focus();
      };
    };
    draw();
  };
  next();
}
function summary(kind, label, nextLabel, nextFn){
  const s=score(cur,kind);
  $("#task").innerHTML = `<div class="sumbox"><div class="big">${s.r}/${s.t}</div><div>${label} · first try</div></div><div class="nextrow" style="justify-content:center"><button class="primary" id="sn">${nextLabel}</button></div>`;
  $("#sn").onclick = nextFn;
}
function startMatch(){ runQuiz({ items:matchItems(), kind:"m", label:"Which word?", render: it=>`<div class="qtext">${esc(it.q)}</div>`,
  onDone: ()=>{ S.done[cur.id+"m"]=true; save(); summary("m","Word challenge","Gap fill →",()=>{ step="gap"; openBlock(); }); } }); }
function startGap(){ runQuiz({ items:gapItems(), kind:"g", label:"Fill the gap", render: it=>`<div class="qtext">“${esc(it.before)}<span class="gap">&nbsp;</span>${esc(it.after)}” <small>${it.ch?"ch. "+it.ch:esc(it.src||"")}</small></div>`,
  onDone: ()=>{ S.done[cur.id+"g"]=true; save(); summary("g","Gap fill","All chapters →",()=>go("home")); } }); }

function renderReport(){
  const rows = BLOCKS.map((b,i)=>{ const bb=score(b,"b"), m=score(b,"m"), g=score(b,"g"); const wrong=[...b.words.map((w,k)=>S.first[b.id+"b"+k]===false||S.first[b.id+"m"+k]===false||S.first[b.id+"g"+k]===false?w.w:null)].filter(Boolean);
    return `<tr><td>${b.core?"Core":i} · ${esc(b.name)}</td><td>${doneKey(b,"b")?`${bb.r} / ${bb.t}`:"–"}</td><td>${doneKey(b,"m")?`${m.r} / ${m.t}`:"–"}</td><td>${doneKey(b,"g")?`${g.r} / ${g.t}`:"–"}</td><td>${[...new Set(wrong)].map(esc).join(", ")||""}</td></tr>`; }).join("");
  const notes = BLOCKS.flatMap(b=>b.words.map((w,k)=>S.notes[b.id+k]?`<div class="row"><b>${esc(w.w)}</b><span>${esc(S.notes[b.id+k])}</span></div>`:"")).join("");
  $("#report-body").innerHTML = `<div class="idrow"><input id="nm" placeholder="Name" value="${esc(S.name||"")}"><button class="primary" id="print">Print / save PDF</button></div>
    <table class="repgrid"><tr><th>Block</th><th>Build</th><th>Words</th><th>Gaps</th><th>Look at again</th></tr>${rows}</table>
    ${notes?`<div class="mynotes"><div class="qlab" style="margin-top:14px">My notes</div>${notes}</div>`:""}
    <p class="foot">Wrong answers were retried until right. Scores are first attempts.</p>`;
  $("#nm").oninput = e=>{ S.name=e.target.value; save(); };
  $("#print").onclick = ()=>{ document.title="My glossary · "+(S.name||""); window.print(); };
}
renderHome();
</script>
</body>
</html>
