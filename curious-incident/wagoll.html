<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Table talk for the Curious Incident speaking folio: click through five minutes at a table one line at a time, move the level up or down, and see which discussion move each line makes.">
<title>Curious Incident · Table Talk</title>
<link rel="stylesheet" href="folio.css">
<style>
.ctl{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:8px 0 12px}
@media (max-width:760px){.ctl{grid-template-columns:1fr}}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.lvl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px;background:var(--band)}
.lvl button{min-height:32px;width:36px;padding:0;justify-content:center;font-size:1.1rem;border-radius:50%}
.lvl .lab{min-width:190px;text-align:center;font-weight:800;font-size:.86rem;color:var(--deep)}
.lvl .lab small{display:block;font-weight:600;font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lvl.exp .lab{color:var(--gold)}

.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:14px}
@media (max-width:860px){.stage{grid-template-columns:1fr}}
.prompt blockquote{margin:0 0 10px;font-size:1rem}
.prompt .task{font-size:.82rem;color:var(--muted);margin:0 0 10px}

/* the table and the four seats */
.table{position:relative;height:150px;margin:6px auto 10px;max-width:520px}
.table .top{position:absolute;left:50%;top:50%;width:64%;height:56px;transform:translate(-50%,-50%);border-radius:40px;background:var(--band);border:2px solid var(--line)}
.seat{position:absolute;width:44px;text-align:center;transition:transform .15s,opacity .15s}
.seat svg{width:44px;height:50px;display:block;margin:0 auto;opacity:.45}
.seat.on svg{opacity:1}
.seat.on{transform:scale(1.18)}
.seat.spoke svg{opacity:.75}
.seat.a{left:8%;top:50%;transform:translateY(-50%)} .seat.a.on{transform:translateY(-50%) scale(1.18)}
.seat.b{left:50%;top:0;transform:translateX(-50%)} .seat.b.on{transform:translateX(-50%) scale(1.18)}
.seat.c{right:8%;top:50%;transform:translateY(-50%)} .seat.c.on{transform:translateY(-50%) scale(1.18)}
.seat.d{left:50%;bottom:0;transform:translateX(-50%)} .seat.d.on{transform:translateX(-50%) scale(1.18)}
@media (prefers-reduced-motion:reduce){.seat{transition:none}}

.bubble{position:relative;background:var(--paper);border:2px solid var(--deep);border-radius:14px;padding:12px 14px;font-family:Georgia,"Times New Roman",serif;font-size:1.05rem;line-height:1.55;min-height:78px}
.bubble .spk{font-family:system-ui,sans-serif;font-size:.68rem;font-weight:800;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:3px}
.bubble.silent{border-style:dashed;color:var(--muted)}
.nav{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.nav .count{font-size:.8rem;color:var(--muted);margin-left:auto}
.sofar{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;font-size:.8rem;color:var(--muted);line-height:1.45}
.sofar div{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:2px 0}
.sofar b{color:var(--deep)}
.sofar .cur{color:var(--ink)}
.sofar .m{font-weight:600}
.sofar[hidden]{display:none}

/* side panel */
.side .card{margin-bottom:10px}
.legend{display:flex;flex-direction:column;gap:5px}
.legend div{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;font-size:.78rem;line-height:1.35}
.legend .chip{white-space:nowrap}
.legend .what{color:var(--muted)}
.chip{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1.5px solid;background:var(--paper)}
.this h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.this .mv{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.this .note{font-size:.88rem;line-height:1.5;margin:0}
.this .none{font-size:.85rem;color:var(--muted)}
.proves{display:none}
.proves.show{display:block}
.proves div{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;font-size:.8rem;line-height:1.4;margin-bottom:5px}

/* colour slots */
.s-blue{color:var(--listen);border-color:var(--listen)} .s-green{color:var(--respond);border-color:var(--respond)}
.s-orange{color:var(--text);border-color:var(--text)} .s-purple{color:var(--invite);border-color:var(--invite)}
.s-grey{color:var(--voice);border-color:var(--voice)}
.m.s-blue{text-decoration-color:var(--listen)} .m.s-green{text-decoration-color:var(--respond);text-decoration-style:dashed}
.m.s-orange{text-decoration-color:var(--text);text-decoration-style:dotted} .m.s-purple{text-decoration-color:var(--invite);text-decoration-style:double}
.m.s-grey{font-style:italic;font-weight:500;text-decoration:none}
</style>
</head>
<body>
<div class="sheet">

<header class="mast">
  <div>
    <div class="kicker">Year 9 English · Curious Incident · Speaking folio</div>
    <h1>Table Talk</h1>
  </div>
  <nav class="site" aria-label="Folio pages">
    <a href="index.html">Prompts</a>
    <a href="wagoll.html" aria-current="page">Table talk</a>
    <a href="rubric.html">Rubric</a>
    <a href="groups.html">Groups</a>
  </nav>
</header>

<div class="ctl">
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="lvl" id="lvl">
    <button id="down" aria-label="Level down">−</button>
    <div class="lab" id="lvlLab"></div>
    <button id="up" aria-label="Level up">+</button>
  </div>
</div>

<div class="stage">
  <div>
    <div class="prompt"><blockquote id="prompt"></blockquote><p class="task" id="task"></p></div>
    <div class="table" id="table"><div class="top"></div></div>
    <div class="bubble" id="bubble"></div>
    <div class="nav">
      <button id="back">◀ Back</button>
      <button class="primary" id="next">Next ▶</button>
      <button id="restart">Restart</button>
      <button id="all" aria-pressed="false">Show all lines</button>
      <span class="count" id="count"></span>
    </div>
    <div class="sofar" id="sofar" hidden></div>
  </div>
  <div class="side">
    <div class="card this" id="this"></div>
    <div class="card"><h3 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Moves in this session</h3><div class="legend" id="legend"></div></div>
    <div class="card proves" id="proves"></div>
    <div class="card" id="cont" style="font-size:.78rem"></div>
  </div>
</div>

<p class="foot">Seats are letters, not people. Chapter references are to the prime-numbered chapters. Use ← → on a keyboard.</p>
</div>

<script src="prompts.js"></script>
<script src="wagoll-content.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const SEATCOL = {A:"#176b87",B:"#744f91",C:"#a34d1d",D:"#357a46",T:"#8b681e"};
const dude = l => `<svg viewBox="0 0 34 40" aria-hidden="true"><circle cx="17" cy="12" r="9" fill="${SEATCOL[l]}"/><path d="M3 40c0-9 6-14 14-14s14 5 14 14z" fill="${SEATCOL[l]}" opacity=".85"/><circle cx="13.5" cy="11" r="1.4" fill="#fff"/><circle cx="20.5" cy="11" r="1.4" fill="#fff"/><path d="M13 16q4 3 8 0" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="17" y="35" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="system-ui,sans-serif">${l}</text></svg>`;

const S = { si: 0, li: 0, line: 0, all: false };
const params = new URLSearchParams(location.search);
if (params.get("session")) S.si = Math.max(0, Math.min(2, +params.get("session") - 1));

const sess = () => SESSIONS[S.si];
/* level positions: 0 = not working, 1..n = the session's levels */
const positions = () => [{ notWorking: true, band: "Not working", level: null, lines: NOT_WORKING.lines, proves: null }, ...sess().levels];
const cur = () => positions()[S.li];
const slotOf = key => (sess().moves.find(m => m.key === key) || { slot: "grey" }).slot;
const nameOf = key => (sess().moves.find(m => m.key === key) || { name: "Voice and body" }).name;
const mark = t => esc(t).replace(/\{(\w+)\|([^}]*)\}/g, (_, k, w) => `<span class="m s-${slotOf(k)}">${w}</span>`);
const movesIn = t => [...t.matchAll(/\{(\w+)\|/g)].map(m => m[1]).filter((v, i, a) => a.indexOf(v) === i);

function renderStatic() {
  $("#tabs").innerHTML = SESSIONS.map((s, i) => `<button role="tab" data-i="${i}" aria-pressed="${i === S.si}">Session ${s.n} · ${esc(s.title)}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { S.si = +b.dataset.i; S.li = Math.min(S.li, positions().length - 1); S.line = 0; renderStatic(); render(); });
  $("#prompt").innerHTML = `${esc(sess().prompt)}<span class="src">${esc(sess().quoteLabel)}</span>`;
  $("#task").textContent = sess().task;
  $("#legend").innerHTML = sess().moves.map(m => `<div><span class="chip s-${m.slot}">${esc(m.name)}</span><span class="what">${esc(m.what)}</span></div>`).join("");
  $("#table").innerHTML = `<div class="top"></div>` + ["A", "B", "C", "D"].map(l => `<div class="seat ${l.toLowerCase()}" data-s="${l}">${dude(l)}</div>`).join("");
}

function contFor(level) {
  if (level == null) return "";
  return `<b style="display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--deep);margin-bottom:3px">Continuum at this level</b>` +
    FOLIO.continuum.strands.filter(s => s.key !== "presenting").map(s => {
      const keys = Object.keys(s.levels).map(Number); const lv = Math.min(level, Math.max(...keys));
      return `<div><span style="color:var(--muted);font-weight:700">${esc(s.name)} ${lv}</span> · ${esc(s.levels[lv])}</div>`;
    }).join("");
}

function render() {
  const p = cur(), lines = p.lines, n = lines.length;
  S.line = Math.max(0, Math.min(S.line, n - 1));
  const [who, text, note] = lines[S.line];
  const exp = p.level === FOLIO.continuum.expected;
  $("#lvl").classList.toggle("exp", exp);
  $("#lvlLab").innerHTML = p.notWorking ? `Not working<small>no level</small>` : `Level ${p.level}<small>${esc(p.band)}${exp ? " · Year 9" : ""}</small>`;
  $("#down").disabled = S.li === 0; $("#up").disabled = S.li === positions().length - 1;
  document.querySelectorAll(".seat").forEach(el => {
    el.classList.toggle("on", el.dataset.s === who);
    el.classList.toggle("spoke", el.dataset.s !== who && lines.slice(0, S.line).some(l => l[0] === el.dataset.s));
  });
  const silent = text.trim() === "…";
  $("#bubble").className = "bubble" + (silent ? " silent" : "");
  $("#bubble").innerHTML = `<span class="spk">${who}</span>${silent ? "(says nothing)" : mark(text)}`;
  $("#count").textContent = `Line ${S.line + 1} of ${n}`;
  $("#back").disabled = S.line === 0; $("#next").disabled = S.line === n - 1;
  const mv = movesIn(text);
  $("#this").innerHTML = `<h3>This line</h3>` + (mv.length ? `<div class="mv">${mv.map(k => `<span class="chip s-${slotOf(k)}">${esc(nameOf(k))}</span>`).join("")}</div>` : `<p class="none">No move marked. Just talk.</p>`) + (note ? `<p class="note">${esc(note)}</p>` : "");
  const pv = $("#proves");
  if (p.proves && S.line === n - 1) { pv.className = "card proves show"; pv.innerHTML = `<h3 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px">What this table proved</h3>` + sess().moves.map(m => `<div><span class="chip s-${m.slot}">${esc(m.name)}</span><span>${esc(p.proves[m.key] || "")}</span></div>`).join(""); }
  else { pv.className = "card proves"; pv.innerHTML = ""; }
  $("#cont").innerHTML = contFor(p.level); $("#cont").style.display = p.level == null ? "none" : "";
  const sf = $("#sofar");
  sf.hidden = !S.all;
  if (S.all) sf.innerHTML = lines.map((l, i) => `<div class="${i === S.line ? "cur" : ""}"><b>${l[0]}</b><span>${l[1].trim() === "…" ? "(says nothing)" : mark(l[1])}</span></div>`).join("");
}

$("#next").onclick = () => { S.line++; render(); };
$("#back").onclick = () => { S.line--; render(); };
$("#restart").onclick = () => { S.line = 0; render(); };
$("#up").onclick = () => { S.li = Math.min(positions().length - 1, S.li + 1); render(); };
$("#down").onclick = () => { S.li = Math.max(0, S.li - 1); render(); };
$("#all").onclick = e => { S.all = !S.all; e.currentTarget.setAttribute("aria-pressed", String(S.all)); render(); };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { if (S.line < cur().lines.length - 1) { S.line++; render(); } }
  if (e.key === "ArrowLeft") { if (S.line > 0) { S.line--; render(); } }
  if (e.key === "ArrowUp") { $("#up").click(); }
  if (e.key === "ArrowDown") { $("#down").click(); }
});
S.li = 2; /* open on the expected level */
renderStatic(); render();
</script>
</body>
</html>
